# WAP Manager — isolated nginx site
# Does NOT replace / touch safwap (safwap.wellnesss360.com).
#
# Safe rules baked in:
#   - unique server_name (≠ safwap.wellnesss360.com)
#   - unique root path  (≠ /var/www/frontend/dist)
#   - no default_server
#   - no limit_req_zone / proxy_cache_path here (those belong in http{} once;
#     duplicating them in sites-enabled breaks ALL nginx configs)
#   - no shared upstream name collision (direct 127.0.0.1:3000)
#   - /api prefix kept (our Fastify); safwap strips /api — different app
#
# Install (copy NEW file — do not edit safwap):
#   sudo cp /software/html-canvas/deploy/nginx/wap-manager.conf /etc/nginx/sites-available/wap-manager
#   sudo ln -sf /etc/nginx/sites-available/wap-manager /etc/nginx/sites-enabled/wap-manager
#   # Edit ONLY: server_name if needed (root already = /software/html-canvas/frontend/dist)
#   sudo nginx -t && sudo systemctl reload nginx
#
# HE underscores (ONE time in /etc/nginx/nginx.conf → http { }):
#   underscores_in_headers on;
# That directive is global and safe for safwap too.

server {
    listen 80;
    # MUST be a different host than safwap.wellnesss360.com
    server_name wap.wellnesss360.com;

    # This server's app path (PM2 templatecraft lives here)
    root /software/html-canvas/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Fastify on :3000 — keep /api path (do NOT use trailing slash strip like safwap :7000/)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # Client IP (same pattern as safwap — scoped to this location only)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Header Enrichment — only affects requests to THIS backend
        proxy_set_header X-MSISDN $http_x_msisdn;
        proxy_set_header X-MSISDN-Number $http_x_msisdn_number;
        proxy_set_header MSISDN $http_msisdn;
        proxy_set_header X-UP-Calling-Line-ID $http_x_up_calling_line_id;
        proxy_set_header X-FH-MSISDN $http_x_fh_msisdn;
        proxy_set_header User-Identity-Forward-msisdn $http_user_identity_forward_msisdn;
        proxy_set_header HTTP_MSISDN $http_http_msisdn;
        proxy_set_header X-Network-Info $http_x_network_info;
        proxy_set_header X-Operator-MSISDN $http_x_operator_msisdn;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# SSL: run certbot ONLY for this server_name
#   sudo certbot --nginx -d wap.wellnesss360.com
# Do NOT re-run certbot against safwap.wellnesss360.com unless you intend to.
