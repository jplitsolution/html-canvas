<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/platform-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WAP Manager</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tabler Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18398284654"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18398284654');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Stale hashed chunks after deploy: the missing file is served as HTML
      // and the dynamic import rejects. Reload once against a new URL so the
      // browser cannot reuse a cached index.html.
      (function () {
        var KEY = 'chunk-reload-at'
        function reloadFresh() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0)
            if (Date.now() - last < 15000) return
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (e) {
            return
          }
          var url = new URL(window.location.href)
          url.searchParams.set('v', Date.now().toString())
          window.location.replace(url.toString())
        }
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault()
          reloadFresh()
        })
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          var msg = String((reason && reason.message) || reason || '')
          if (
            msg.indexOf('dynamically imported module') === -1 &&
            msg.indexOf('Importing a module script failed') === -1
          ) return
          event.preventDefault()
          reloadFresh()
        })
      })()
    </script>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
